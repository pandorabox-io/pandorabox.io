# https://github.com/TecharoHQ/anubis/tree/main/data

bots:
  - name: custom-bots
    action: DENY
    expression:
     any:
      - userAgent.startsWith("meta-webindexer")
  
  - name: ddos-range-AS63179-twitter
    action: DENY
    remote_addresses:
      [
        "69.12.59.0/24",
        "192.48.237.0/24",
        "69.12.60.0/24",
        "192.48.236.0/24",
        "69.12.58.0/24",
        "69.12.62.0/24",
        "69.12.63.0/24",
        "69.12.57.0/24",
        "69.12.56.0/21",
        "69.12.56.0/24",
        "69.12.61.0/24"
      ]

  - import: (data)/clients/x-firefox-ai.yaml
  - import: (data)/clients/git.yaml
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml
  - import: (data)/meta/ai-block-aggressive.yaml
  - import: (data)/crawlers/_allow-good.yaml
  - import: (data)/common/keep-internet-working.yaml

  - name: heavy-get-ops
    action: WEIGH
    weight:
      adjust: 5
    expression:
     all:
      - method == "GET"
      - path.matches("(^/index.php.*$|^api.php.*$)")

thresholds:
  - name: minimal-suspicion
    expression: weight < 0
    action: ALLOW

  - name: issue-challenge
    expression: weight >= 5
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 3

dnsbl: false

status_codes:
  CHALLENGE: 200
  DENY: 200

store:
  backend: bbolt
  parameters:
    path: /data/anubis.bdb
